name: moysklad-trainee

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql
    hostname: db
  app:
    image: moysklad-trainee-app
    restart: on-failure
    env_file: .env
    ports:
      - 8080:8080
    depends_on:
      - db
    volumes:
      - logs:/var/log/moysklad-trainee
    hostname: app
    build: .
  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    depends_on:
      - app
    volumes:
      - prometheus:/prometheus
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-alert-rules
        target: /etc/prometheus/alert.rules.yml

volumes:
  db:
  logs:
  prometheus:

configs:
  prometheus:
    file: prometheus/prometheus.yml
  prometheus-alert-rules:
    file: prometheus/alert.rules.yml
