name: moysklad-trainee

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    ports:
      - 5432:5432
    volumes:
      - db:/var/lib/postgresql
    hostname: db
  app:
    image: moysklad-trainee-app
    restart: on-failure
    env_file: .env
    ports:
      - 8080:8080
    depends_on:
      - db
    volumes:
      - logs:/var/log/moysklad-trainee
    build: .

volumes:
  db:
  logs:
