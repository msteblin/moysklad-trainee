groups:
  - name: moysklad-trainee-alerts
    interval: 15s
    rules:
      - alert: applicationDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Приложение недоступно
          description: Приложение не отвечает на запросы более одной минуты.
      - alert: highHttpErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Высокий уровень ошибок HTTP 5ХХ
          description: Доля ошибок HTTP 5XX превысила порог в 5% за последние 5 минут.
      - alert: dbPoolExhaustion
        expr: |
          hikaricp_connections_active{job="prometheus", pool="pool"} /
          hikaricp_connections_max{job="prometheus", pool="pool"}
          > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Исчерпание пула соединений
          description: Пул соединений был исчерпан на >=90% за последние 5 минут.
